name: Bridge checks
on:
  push:
    branches: ["refactor/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "mcp>=2,<3"
      - run: python -m compileall -q bridge
      - run: python -m unittest discover -s tests -v
      - name: MCP server registration
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from bridge.server import build_server

          with tempfile.TemporaryDirectory() as root:
              workspace = Path(root) / "project"
              workspace.mkdir()
              (workspace / "AGENTS.md").write_text("# Project\n")
              (workspace / "orchestrate_workflow").mkdir()
              (workspace / "orchestrate_workflow" / "method.md").write_text("# Binding\n")
              os.environ["ORCHESTRATE_WORKSPACE"] = str(workspace)
              os.environ["ORCHESTRATE_STATE_DIR"] = str(Path(root) / "state")
              server = build_server()
              assert server is not None
          PY
