name: Bridge checks
on:
  push:
    branches: ["refactor/**"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q bridge
      - run: python -m unittest discover -s tests -v
